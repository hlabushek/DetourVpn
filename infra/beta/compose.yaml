name: detourvpn-beta
services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn_beta_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - max_connections=25
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - max_wal_size=512MB
    ports: ["127.0.0.1:25433:5432"]
    volumes:
      - beta_postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-detourvpn-beta.sh:ro
    secrets: [pg_bootstrap, pg_migrator, pg_runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_beta_bootstrap -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
volumes:
  beta_postgres_data:
secrets:
  pg_bootstrap:
    file: /etc/detourvpn-beta/secrets/pg-bootstrap
  pg_migrator:
    file: /etc/detourvpn-beta/secrets/pg-migrator
  pg_runtime:
    file: /etc/detourvpn-beta/secrets/pg-runtime
